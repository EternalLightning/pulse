name: Build and publish Pulse

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pulse-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate release tag
        shell: pwsh
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          $version = (Get-Content version.txt -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+(\.\d+)?$' -or $env:RELEASE_REF -ne "refs/tags/v$version") {
            throw 'Push or select a version tag matching version.txt, for example v1.1.4.0.'
          }
      - name: Build, test and package
        shell: pwsh
        run: |
          ./scripts/build_release_ci.ps1
          ./scripts/package_portable.ps1 -BuildDir build-ci
          ./scripts/verify_release_artifacts.ps1 -BuildDir build-ci
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            dist/PulseSetup-*.exe
            dist/Pulse-*-portable-win-x64.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostics-windows
          path: |
            bench_data/selftest_1b2_last.log
            build-ci/*.log
          if-no-files-found: ignore

  publish:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: dist
      - name: Publish installer and portable archive
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish_release.ps1
